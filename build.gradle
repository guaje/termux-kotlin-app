plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.compose) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.hilt) apply false
    alias(libs.plugins.detekt) apply false
}

// Keep these for backward compatibility with existing modules
ext {
    kotlin_version = '2.0.21'
    detekt_version = '1.23.7'
    markwonVersion = '4.6.2'
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// Apply Detekt and JaCoCo to all subprojects so testDebugUnitTest produces .exec data
subprojects {
    apply plugin: 'jacoco'
    apply plugin: 'io.gitlab.arturbosch.detekt'

    tasks.withType(Test).configureEach {
        jacoco.includeNoLocationClasses = true
        jacoco.excludes = ['jdk.internal.*']
    }

    detekt {
        buildUponDefaultConfig = true
        allRules = false
        config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
        baseline = file("$projectDir/config/detekt/baseline.xml")
        parallel = true
    }

    tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
        jvmTarget = "17"
        reports {
            html.required.set(true)
            xml.required.set(true)
            txt.required.set(false)
            sarif.required.set(true)
        }
    }
}

// JaCoCo coverage for root and subprojects; modules with no tests remain in the denominator.
apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.12'
}

def coverageExcludes = [
    '**/R.class',
    '**/R$*.class',
    '**/BuildConfig.*',
    '**/Manifest*.*',
    '**/*Test*.*',
    '**/*_Factory*.*',
    '**/*Module_*Factory*.*',
    '**/*_MembersInjector*.*',
    '**/*_GeneratedInjector*.*',
    '**/*_Impl*.*',
    '**/*_LazyMapKey*.*',
    '**/Hilt_*.*',
    '**/*HiltModules*.*',
    '**/Dagger*.*',
    '**/*_ComponentTreeDeps*.*',
    '**/dagger/hilt/internal/**',
    '**/hilt_aggregated_deps/**',
    '**/*JsonAdapter*.*',
    '**/*serializer*.*'
]

task jacocoTestReport(type: JacocoReport, group: 'verification') {
    description = 'Runs all debug unit tests and generates an aggregate coverage report.'
    dependsOn rootProject.subprojects.collect { "${it.path}:testDebugUnitTest" }

    reports {
        xml.required.set(true)
        xml.outputLocation.set(layout.buildDirectory.file('reports/jacoco/jacocoTestReport/jacocoTestReport.xml'))
        html.required.set(true)
        html.outputLocation.set(layout.buildDirectory.dir('reports/jacoco/jacocoTestReport/html'))
        csv.required.set(false)
    }

    rootProject.subprojects.each { proj ->
        if (proj.path == ':app') {
            // Hilt transforms application classes; use the transformed output so
            // the report matches the bytecode recorded in JaCoCo execution data.
            classDirectories.from(proj.fileTree(
                dir: "${proj.buildDir}/intermediates/classes/debug/transformDebugClassesWithAsm/dirs",
                excludes: coverageExcludes
            ))
        } else {
            classDirectories.from(
                proj.fileTree(dir: "${proj.buildDir}/tmp/kotlin-classes/debug", excludes: coverageExcludes),
                proj.fileTree(dir: "${proj.buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: coverageExcludes)
            )
        }
        sourceDirectories.from(
            "${proj.projectDir}/src/main/java",
            "${proj.projectDir}/src/main/kotlin"
        )
        executionData.from(proj.fileTree(dir: proj.buildDir, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec'
        ]))
    }
}
