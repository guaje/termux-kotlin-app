plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

// The same release certificate as the app. The permission that crosses between the two APKs is
// signature-level, so this is the authentication, not a packaging preference: an anchor signed by
// any other key never receives a heartbeat, and never says so. See the script's header.
apply from: "$rootDir/gradle/release-signing.gradle"

android {
    namespace "com.termux.anchor"

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        // Its own applicationId, and deliberately NO android:sharedUserId, which is what the app
        // declares for itself. A shared uid shares process death as well as data: the supervisor that
        // exists to outlive the app must not be in the same blast radius, and it would also have to be
        // installed and uninstalled as one unit with it.
        //
        // No applicationIdSuffix either. The app's devkit scripts and the anchor's manifest both name
        // com.termux.anchor literally, and a suffix that silently varied per variant would make the
        // pair unable to see each other while every build still installed.
        applicationId "com.termux.anchor"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()

        // Independent of the app's version on purpose. The app derives its versionCode from a git tag
        // because a published APK must never silently regress; this APK is not in the release train,
        // and a supervisor whose build breaks because a tag was missing is the wrong kind of fragile.
        // Parenthesised deliberately. In a Groovy command expression the argument ends at the method
        // call, so `versionName System.getenv("X") ?: "0.1.0"` evaluates versionName(null) first and
        // applies the elvis to its return value - which AGP rejects as "Value is null", pointing at this
        // line while implying the environment was wrong.
        versionName(System.getenv("TERMUX_ANCHOR_VERSION_NAME") ?: "0.1.0")
        versionCode((System.getenv("TERMUX_ANCHOR_VERSION_CODE") ?: "1").toInteger())
    }

    signingConfigs {
        debug {
            // The app's own debug keystore, not the AGP default one. The reason is the permission
            // again: it is signature-level, so two debug APKs signed by different keys cannot talk to
            // each other at all, and a debug pair that cannot exercise the only channel that matters
            // would be tested exactly never. The dev and release build types get this property from
            // the shared release config instead.
            storeFile file('../app/testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            // Not minified, unlike the app. R8 would buy a few tens of kilobytes here and in exchange
            // would put a shrinking step in front of the one component that has to keep working when
            // the app is not; and this variant is not in the release train, so nothing verifies the
            // stripped result on a handset. Revisit if that changes.
            minifyEnabled false
            shrinkResources false // Reproducible builds, and the same reason the app gives.
            signingConfig signingConfigs.release
        }

        debug {
            signingConfig signingConfigs.debug
        }

        // Same contract as the app's dev variant (see the long comment in app/build.gradle): it is
        // release-signed so that `adb install -r` replaces the handset build instead of being refused
        // with INSTALL_FAILED_UPDATE_INCOMPATIBLE, whose usual recovery is an uninstall, and an
        // uninstall of com.termux deletes $PREFIX with everything inside it. It stays non-minified and
        // debuggable so that `adb shell run-as com.termux.anchor` works while debugging this APK.
        dev {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            debuggable true
            // Inert today: this module depends on no sibling module, so there is nothing to fall back
            // to. It is declared so that adding a dependency on one later does not silently break the
            // dev variant with "Could not find the version of dependency :x for build type dev".
            matchingFallbacks = ['debug']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Deliberately absent from this module, all of them: no ndkVersion, no externalNativeBuild, no
    // bootstrap download, no abi splits, no Compose, no Hilt, no Room, no KSP, no viewBinding, and no
    // project(":termux-shared"). The anchor ships in seconds and must keep working across an app
    // replacement, so the amount of machinery that can fail between "install" and "watching" is kept
    // at zero - and termux-shared would drag in the app's bootstrap assumptions for one log call.
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat

    testImplementation libs.junit
}
