# Disabled for v2.5.0: publishing debug APKs made Android/Obtainium updates
# unreliable and could switch signing lineages. Signed releases are created only by
# .github/workflows/release.yml from an explicit v* tag or workflow dispatch.
name: Disabled Auto Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Automatic debug releases are disabled; use release.yml.'
