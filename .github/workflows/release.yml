name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example, v2.5.0)'
        required: true
        type: string
      publish:
        description: 'Publish a GitHub release; false only uploads validated workflow artifacts.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: '1'

jobs:
  lint-and-test:
    name: Lint, test, and validate version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          echo "TERMUX_APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TERMUX_APK_VERSION_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Validate Gradle release metadata
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_NAME="$(./gradlew --no-daemon --console=plain -q :app:versionName | tail -n 1)"
          ACTUAL_CODE="$(./gradlew --no-daemon --console=plain -q :app:versionCode | tail -n 1)"
          if [[ "$ACTUAL_NAME" != "$TERMUX_APP_VERSION_NAME" ]]; then
            echo "APK versionName would be '$ACTUAL_NAME', expected '$TERMUX_APP_VERSION_NAME'" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == 'v2.5.0' && "$ACTUAL_CODE" != '20500999' ]]; then
            echo "v2.5.0 must use versionCode 20500999, got $ACTUAL_CODE" >&2
            exit 1
          fi
          echo "Validated versionName=$ACTUAL_NAME versionCode=$ACTUAL_CODE"

      - name: Validate bundled assets
        run: ./scripts/validate-bundled-assets.sh

      - name: Run lint and unit tests
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest

  build-release:
    name: Build signed APKs
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Resolve release metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
          echo "TERMUX_APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TERMUX_APK_VERSION_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo 'All release signing secrets must be configured.' >&2
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/termux-release.keystore
          cat > signing.properties <<EOF
          storeFile=termux-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Validate APK metadata and signatures
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR='app/build/outputs/apk/release'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          EXPECTED_CODE="$(./gradlew --no-daemon --console=plain -q :app:versionCode | tail -n 1)"

          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | sort)
          if [[ ${#APKS[@]} -ne 5 ]]; then
            echo "Expected five release APKs (four ABIs plus universal), found ${#APKS[@]}" >&2
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          : > "$APK_DIR/sha256sums.txt"
          EXPECTED_CERT=''
          for apk in "${APKS[@]}"; do
            BADGING="$($AAPT dump badging "$apk")"
            PACKAGE_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")"
            VERSION_NAME="$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
            VERSION_CODE="$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"

            [[ "$PACKAGE_ID" == 'com.termux' ]] || { echo "Unexpected package ID in $apk: $PACKAGE_ID" >&2; exit 1; }
            [[ "$VERSION_NAME" == "$TERMUX_APP_VERSION_NAME" ]] || { echo "Unexpected versionName in $apk: $VERSION_NAME" >&2; exit 1; }
            [[ "$VERSION_CODE" == "$EXPECTED_CODE" ]] || { echo "Unexpected versionCode in $apk: $VERSION_CODE" >&2; exit 1; }
            if grep -q '^application-debuggable' <<< "$BADGING"; then
              echo "Release APK is debuggable: $apk" >&2
              exit 1
            fi

            VERIFY="$($APKSIGNER verify --verbose --print-certs "$apk")"
            CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY" | head -n 1)"
            [[ -n "$CERT" ]] || { echo "Could not read signing certificate from $apk" >&2; exit 1; }
            if [[ -z "$EXPECTED_CERT" ]]; then
              EXPECTED_CERT="$CERT"
            elif [[ "$CERT" != "$EXPECTED_CERT" ]]; then
              echo "Release APKs do not share one signing certificate." >&2
              exit 1
            fi

            (cd "$APK_DIR" && sha256sum "$(basename "$apk")") >> "$APK_DIR/sha256sums.txt"
          done

          echo "certificate_sha256=$EXPECTED_CERT" >> "$GITHUB_OUTPUT"
          echo "Validated ${#APKS[@]} signed APKs with versionName=$TERMUX_APP_VERSION_NAME versionCode=$EXPECTED_CODE"

      - name: Create release notes
        shell: bash
        run: |
          cat > release_notes.md <<EOF
          ## Termux Kotlin $RELEASE_TAG

          This release contains integrated X11/VNC, Kitty keyboard protocol support, integrated Termux:API, and the Obtainium version metadata fix.

          The APK manifest reports versionName \`$TERMUX_APP_VERSION_NAME\` with a monotonically increasing versionCode. All attached APKs are release-signed with certificate SHA-256 \`${{ steps.validate.outputs.certificate_sha256 }}\`.

          ### Obtainium

          Add \`${{ github.server_url }}/${{ github.repository }}\` and select \`termux-app_${RELEASE_TAG}_universal.apk\`, or the APK matching your device ABI.

          If an older \`com.termux\` installation was signed by F-Droid, Google Play, or a debug/test key, Android requires a one-time uninstall before this signing lineage can be installed.
          EOF

      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Termux Kotlin ${{ env.RELEASE_TAG }}
          body_path: release_notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-alpha.') || contains(env.RELEASE_TAG, '-beta.') || contains(env.RELEASE_TAG, '-rc.') }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt

      - name: Upload validated APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: termux-kotlin-${{ env.RELEASE_TAG }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sums.txt
          retention-days: 90
