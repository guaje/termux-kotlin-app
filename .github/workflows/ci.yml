# Termux-Kotlin OS - Comprehensive CI/CD Pipeline
# Handles: validation, bootstrap generation, emulator testing, 
# repo publishing, and release automation
#
# NOTE: Using com.termux package name for full upstream compatibility

name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: 'Force full package rebuild'
        type: boolean
        default: false
      skip_emulator_test:
        description: 'Skip emulator tests'
        type: boolean
        default: false
      create_release:
        description: 'Create a GitHub release (otherwise just builds debug APK)'
        type: boolean
        default: false
  schedule:
    # Nightly build at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  # One run per workflow file + ref. Pull request events carry refs/pull/<n>/merge, so a PR only
  # ever supersedes its own previous run.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Pushes to main must not cancel what is already running: the four bootstrap legs inherit the
  # default 6h ceiling, so a second push to main was killing the run that was validating the first,
  # including the emulator job. Scheduled and manually dispatched main runs queue instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
  PACKAGE_NAME: com.termux
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false'

jobs:
  # ============================================================
  # JOB 1: Code Quality Check (replaces prefix validation)
  # ============================================================
  validate_prefix:
    name: Validate Prefix
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.validate.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run prefix validation
        id: validate
        run: |
          ./scripts/validate-prefix.sh --fast
          ./scripts/validate-bundled-assets.sh
        continue-on-error: false

      - name: Collect failure logs
        if: failure()
        run: |
          export JOB_NAME="validate_prefix"
          export FAILED_STEP="prefix-validation"
          ./scripts/collect-failure-logs.sh collect

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-validate_prefix
          path: artifacts/failures/validate_prefix/
          retention-days: 14

  # ============================================================
  # JOB 2: Detect Package Changes
  # ============================================================
  detect_package_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: [validate_prefix]
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      rebuild_required: ${{ steps.detect.outputs.rebuild_required }}
      package_count: ${{ steps.detect.outputs.package_count }}
      bootstrap_changed: ${{ steps.detect.outputs.bootstrap_changed }}
      infra_changed: ${{ steps.detect.outputs.infra_changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Get last successful commit
        id: last_success
        run: |
          # Try to get last successful workflow run commit
          LAST_COMMIT=$(gh api \
            "/repos/${{ github.repository }}/actions/runs?status=success&branch=${{ github.ref_name }}&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || echo "")
          
          if [ -n "$LAST_COMMIT" ] && [ "$LAST_COMMIT" != "null" ]; then
            echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT
          else
            echo "last_commit=HEAD~1" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect package changes
        id: detect
        run: |
          export LAST_SUCCESSFUL_COMMIT="${{ steps.last_success.outputs.last_commit }}"
          ./scripts/detect-package-changes.sh
        env:
          GITHUB_OUTPUT: $GITHUB_OUTPUT

      - name: Force full rebuild check
        if: github.event.inputs.force_full_rebuild == 'true'
        run: |
          echo "rebuild_required=true" >> $GITHUB_OUTPUT
          echo "Force full rebuild requested"

      - name: Upload change detection results
        uses: actions/upload-artifact@v6
        with:
          name: change-detection
          path: |
            /tmp/changed-packages.txt
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # JOB 3: Build Packages (Docker)
  # ============================================================
  build_packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [validate_prefix, detect_package_changes]
    if: needs.detect_package_changes.outputs.rebuild_required == 'true' || github.event.inputs.force_full_rebuild == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, x86_64, i686]
    outputs:
      status: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Download change detection
        uses: actions/download-artifact@v7
        with:
          name: change-detection
          path: ./change-detection
        continue-on-error: true

      - name: Set up Docker
        run: |
          docker pull termux/package-builder || echo "Using cached image"

      - name: Build packages for ${{ matrix.arch }}
        id: build
        run: |
          echo "Building packages for ${{ matrix.arch }}..."
          
          # Get list of packages to rebuild
          PACKAGES=""
          if [ -f "./change-detection/changed-packages.txt" ]; then
            PACKAGES=$(cat ./change-detection/changed-packages.txt | tr '\n' ' ')
          fi
          
          # Default packages if none detected
          if [ -z "$PACKAGES" ]; then
            PACKAGES="apt dpkg"
          fi
          
          echo "Packages to build: $PACKAGES"
          
          # Create output directory
          mkdir -p output/${{ matrix.arch }}
          
          # Run Docker builder
          docker run --rm \
            -v "$PWD/termux-packages:/home/builder/termux-packages:rw" \
            -v "$PWD/output/${{ matrix.arch }}:/home/builder/output:rw" \
            termux/package-builder \
            bash -c "
              cd /home/builder/termux-packages
              
              # Update package name
              if [ -f scripts/properties.sh ]; then
                sed -i 's/TERMUX_APP__PACKAGE_NAME=\"com.termux\"/TERMUX_APP__PACKAGE_NAME=\"com.termux.kotlin\"/' scripts/properties.sh
              fi
              
              # Build each package
              for pkg in $PACKAGES; do
                echo \"Building \$pkg for ${{ matrix.arch }}...\"
                ./build-package.sh -a ${{ matrix.arch }} \$pkg || echo \"Package \$pkg build failed\"
              done
              
              # Copy output
              cp -v output/*.deb /home/builder/output/ 2>/dev/null || true
            " || echo "Some packages failed to build"

      - name: Validate rebuilt packages
        run: |
          echo "Validating rebuilt packages..."
          ./scripts/validate-prefix.sh --fast --dir output/${{ matrix.arch }}

      - name: Upload built packages
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.arch }}
          path: output/${{ matrix.arch }}/*.deb
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect failure logs
        if: failure()
        run: |
          export JOB_NAME="build_packages_${{ matrix.arch }}"
          export FAILED_STEP="package-build"
          ./scripts/collect-failure-logs.sh collect

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-build_packages-${{ matrix.arch }}
          path: artifacts/failures/build_packages_${{ matrix.arch }}/
          retention-days: 14

  # ============================================================
  # JOB 4: Build Bootstrap
  # ============================================================
  build_bootstrap:
    name: Build Bootstrap
    runs-on: ubuntu-latest
    needs: [validate_prefix, detect_package_changes, build_packages]
    if: always() && needs.validate_prefix.result == 'success' && (needs.detect_package_changes.outputs.bootstrap_changed == 'yes' || needs.build_packages.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, x86_64, i686]
    outputs:
      status: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Fetch termux-packages source
        id: source
        run: |
          set -euo pipefail
          # build-custom-bootstrap.sh drives the termux build system, which needs a checkout of
          # termux-packages. The path used to be hardcoded to /root/termux-packages, which no
          # GitHub-hosted runner has, so the job failed its preflight without building anything.
          export TERMUX_PACKAGES_DIR="${TERMUX_PACKAGES_DIR:-$GITHUB_WORKSPACE/termux-packages}"
          echo "dir=$TERMUX_PACKAGES_DIR" >> "$GITHUB_OUTPUT"
          if [ -d "$TERMUX_PACKAGES_DIR/.git" ]; then
            echo "Reusing existing checkout at $TERMUX_PACKAGES_DIR"
            exit 0
          fi
          git clone --depth 1 --single-branch https://github.com/termux/termux-packages.git "$TERMUX_PACKAGES_DIR"

      - name: Download built packages
        uses: actions/download-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: ./rebuilt-packages/${{ matrix.arch }}
        continue-on-error: true

      - name: Download previous bootstrap (for diff)
        run: |
          mkdir -p old_bootstrap
          # Try to get previous bootstrap from releases or artifacts
          gh release download --pattern "bootstrap-${{ matrix.arch }}.zip" -D old_bootstrap 2>/dev/null || \
          echo "No previous bootstrap found for comparison"
          
          # Extract if downloaded
          if [ -f "old_bootstrap/bootstrap-${{ matrix.arch }}.zip" ]; then
            mkdir -p old_bootstrap/${{ matrix.arch }}
            unzip -q old_bootstrap/bootstrap-${{ matrix.arch }}.zip -d old_bootstrap/${{ matrix.arch }} || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Build bootstrap for ${{ matrix.arch }}
        id: build
        env:
          TERMUX_PACKAGES_DIR: ${{ steps.source.outputs.dir }}
          OUTPUT_DIR: ${{ github.workspace }}/bootstrap-out
          APP_DIR: ${{ github.workspace }}
        run: |
          echo "Building bootstrap for ${{ matrix.arch }}..."
          
          # Create output directory
          mkdir -p new_bootstrap/${{ matrix.arch }}
          
          # Run bootstrap build script
          if [ -f scripts/build-custom-bootstrap.sh ]; then
            WORK_DIR=/tmp/bootstrap-work ./scripts/build-custom-bootstrap.sh ${{ matrix.arch }}
          else
            ./scripts/build-bootstrap.sh ${{ matrix.arch }}
          fi
          
          # Copy output
          # Collect whatever the build produced. It used to copy from app/src/main/cpp/, where the
          # script has never written: it places bootstrap zips in OUTPUT_DIR.
          cp -v "$OUTPUT_DIR"/bootstrap-*.zip new_bootstrap/ 2>/dev/null || true

      - name: Validate bootstrap
        run: |
          echo "Validating bootstrap..."
          
          # Extract for validation
          mkdir -p new_bootstrap/${{ matrix.arch }}_extracted
          unzip -q new_bootstrap/bootstrap-${{ matrix.arch }}.zip -d new_bootstrap/${{ matrix.arch }}_extracted 2>/dev/null || true
          
          ./scripts/validate-prefix.sh --fast --dir new_bootstrap/${{ matrix.arch }}_extracted

      - name: Generate bootstrap diff
        run: |
          if [ -d "old_bootstrap/${{ matrix.arch }}" ]; then
            ./scripts/bootstrap-diff.sh \
              "old_bootstrap/${{ matrix.arch }}" \
              "new_bootstrap/${{ matrix.arch }}_extracted" \
              "bootstrap-diff-${{ matrix.arch }}.md"
          else
            echo "# No Previous Bootstrap" > bootstrap-diff-${{ matrix.arch }}.md
            echo "First bootstrap build - no comparison available." >> bootstrap-diff-${{ matrix.arch }}.md
          fi

      - name: Upload bootstrap
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-${{ matrix.arch }}
          path: |
            new_bootstrap/bootstrap-${{ matrix.arch }}.zip
            app/src/main/cpp/bootstrap-${{ matrix.arch }}.zip
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload diff report
        uses: actions/upload-artifact@v6
        with:
          name: bootstrap-diff-${{ matrix.arch }}
          path: bootstrap-diff-${{ matrix.arch }}.md
          retention-days: 14

      - name: Collect failure logs
        if: failure()
        run: |
          export JOB_NAME="build_bootstrap_${{ matrix.arch }}"
          export FAILED_STEP="bootstrap-build"
          ./scripts/collect-failure-logs.sh collect

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-build_bootstrap-${{ matrix.arch }}
          path: artifacts/failures/build_bootstrap_${{ matrix.arch }}/
          retention-days: 14

  # ============================================================
  # JOB 5: Build Android APK
  # ============================================================
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    # The bootstrap is an optional input: "Download bootstraps" is continue-on-error and the copy
    # step swallows failures, so the APK builds without it. Depending on build_bootstrap here put
    # the APK, and therefore every test that needs it, behind a job that cannot currently succeed.
    needs: [validate_prefix]
    if: always() && needs.validate_prefix.result == 'success'
    outputs:
      status: ${{ steps.build.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download bootstraps
        uses: actions/download-artifact@v7
        with:
          pattern: bootstrap-*
          path: ./bootstraps
          merge-multiple: true
        continue-on-error: true

      - name: Copy bootstraps to app
        run: |
          mkdir -p app/src/main/cpp
          find ./bootstraps -name "bootstrap-*.zip" -exec cp {} app/src/main/cpp/ \; 2>/dev/null || true
          ls -la app/src/main/cpp/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v6
        with:
          name: debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Collect failure logs
        if: failure()
        run: |
          export JOB_NAME="build_apk"
          export FAILED_STEP="apk-build"
          chmod +x scripts/collect-failure-logs.sh
          ./scripts/collect-failure-logs.sh collect

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-build_apk
          path: artifacts/failures/build_apk/
          retention-days: 14

  # ============================================================
  # JOB 6: Emulator Smoke Tests
  # ============================================================
  emulator_test:
    name: Emulator Tests
    runs-on: ubuntu-latest
    needs: [build_apk]
    # github.event.inputs only exists for workflow_dispatch runs, so the previous condition was
    # false on every push, pull request and scheduled run and the smoke tests never executed.
    # Only a "skip" explicitly chosen when dispatching the workflow may suppress them now.
    if: needs.build_apk.result == 'success' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_emulator_test != 'true')
    timeout-minutes: 60
    outputs:
      status: ${{ steps.test.outcome }}
      tests_passed: ${{ steps.test.outputs.tests_passed }}
      tests_failed: ${{ steps.test.outputs.tests_failed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: debug-apks
          path: ./apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator tests
        id: test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          heap-size: 512M
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # This action executes the input below one line at a time, each line in its own shell, so
          # a multi line shell construct here is split apart and dies with "Syntax error: end of file
          # unexpected (expecting fi)" before a single test runs. Everything that needs more than one
          # line lives in scripts/run-emulator-smoke-test.sh.
          script: |
            ./scripts/run-emulator-smoke-test.sh

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: emulator-test-results
          path: |
            /tmp/emulator-test-logs/
          retention-days: 14

      - name: Collect failure logs
        if: failure()
        run: |
          export JOB_NAME="emulator_test"
          export FAILED_STEP="smoke-test"
          ./scripts/collect-failure-logs.sh collect
          ./scripts/collect-failure-logs.sh emulator

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-emulator_test
          path: artifacts/failures/emulator_test/
          retention-days: 14

  # ============================================================
  # JOB 7: Publish Package Repository
  # ============================================================
  publish_repo:
    name: Publish Repo
    runs-on: ubuntu-latest
    needs: [validate_prefix]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate_prefix.result == 'success'
    outputs:
      status: ${{ steps.publish.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # The package feed is generated entirely from this repository: the epoch termux-api .deb
      # files come from app/src/main/assets/bootstrap-packages/ and Packages/Release are rebuilt
      # from those files by scripts/generate-repo.sh. Nothing is inherited from a previous
      # publication, which is why there is deliberately no gh-pages checkout here.
      #
      # Do not reintroduce that inheritance. A checkout with `ref: gh-pages` cannot tell "branch
      # does not exist" from "checkout failed": either way it leaves a .git directory behind, so
      # the existence guard that used to follow it reported the opposite of the truth and the
      # push then asked for a ref that had never been created. If another package belongs on the
      # feed, stage it from the repository in the step below.

      - name: Prepare fork termux-api packages
        run: |
          set -euo pipefail
          ndk_path="${ANDROID_NDK_HOME:-}"
          if [[ ! -d "$ndk_path" && -n "${ANDROID_HOME:-}" && -d "$ANDROID_HOME/ndk" ]]; then
            ndk_path=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi

          if [[ -n "$ndk_path" && -d "$ndk_path" ]]; then
            echo "Building termux-api from source with Android NDK: $ndk_path"
            ./scripts/build-termux-api-binary.sh --ndk-path "$ndk_path"
            ./scripts/build-termux-api-deb.sh
          else
            echo "NOTICE: Android NDK is unavailable; publishing the committed termux-api assets."
          fi

          for arch in aarch64 arm x86_64 i686; do
            deb="app/src/main/assets/bootstrap-packages/$arch/termux-api_1%3a0.59.1-1_${arch}.deb"
            if [[ ! -f "$deb" ]]; then
              echo "ERROR: Missing expected termux-api package: $deb" >&2
              exit 1
            fi
          done

      - name: Generate and validate repository metadata
        id: publish
        run: |
          set -euo pipefail
          # Built from scratch every run: the feed is a function of the repository, so a stale
          # file left over from an older publication cannot survive into it.
          rm -rf pages
          mkdir -p pages/repo

          for arch in aarch64 arm x86_64 i686; do
            repo_arch="pages/repo/$arch"
            source_deb="app/src/main/assets/bootstrap-packages/$arch/termux-api_1%3a0.59.1-1_${arch}.deb"
            mkdir -p "$repo_arch"
            cp "$source_deb" "$repo_arch/"
          done

          GPG_KEY="" ./scripts/generate-repo.sh "$PWD/pages/repo"

          for arch in aarch64 arm x86_64 i686; do
            test -f "pages/repo/$arch/termux-api_1%3a0.59.1-1_${arch}.deb"
            test -s "pages/repo/$arch/Packages"
            test -s "pages/repo/$arch/Packages.gz"
          done
          test -s pages/repo/Release
          ./scripts/validate-repo-index.sh pages/repo

      - name: Write the apt source snippet
        run: |
          set -euo pipefail
          # Derived from the repository running the workflow, so the feed URL cannot silently point
          # somewhere else. One line rather than four: pasting four sources leaves apt complaining
          # about the three that do not match the device.
          owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY##*/}"
          cat > pages/repo/sources.list.template <<'TEMPLATE'
          # Termux-Kotlin package feed (unsigned, so [trusted=yes] is required).
          #
          # Install in one command on the device:
          #   echo "deb [trusted=yes] __BASE__/$(dpkg --print-architecture)/ ./" \
          #     > "$PREFIX/etc/apt/sources.list.d/termux-kotlin.list"
          #   pkg update
          #
          # Or write the line yourself, using the architecture reported by
          # dpkg --print-architecture: aarch64, arm, x86_64 or i686.
          deb [trusted=yes] __BASE__/ARCH/ ./
          TEMPLATE
          sed -i "s|__BASE__|https://${owner}.github.io/${repo}/repo|g" pages/repo/sources.list.template

      - name: Publish pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "Feed is unchanged, nothing to publish"
          else
            git commit -q -m "Publish package repository [skip ci]"
            # This nested repository has no credentials of its own, unlike a directory produced by
            # actions/checkout. Authenticate with a per-command header instead of putting the
            # token in the remote URL. Pushing HEAD rather than a branch name means the push does
            # not depend on a ref that only exists after the first commit.
            auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push --force "https://github.com/${{ github.repository }}" HEAD:gh-pages
          fi

      - name: Collect failure logs
        if: failure()
        run: |
          export JOB_NAME="publish_repo"
          export FAILED_STEP="repository-publish"
          chmod +x scripts/collect-failure-logs.sh
          ./scripts/collect-failure-logs.sh collect

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-publish_repo
          path: artifacts/failures/publish_repo/
          retention-days: 14

  # ============================================================
  # JOB 8: Legacy release path (disabled)
  # Signed releases are published exclusively by release.yml.
  # ============================================================
  release:
    name: Create Release (disabled; use release.yml)
    runs-on: ubuntu-latest
    needs: [validate_prefix, build_apk, build_bootstrap, emulator_test]
    if: false
    outputs:
      status: ${{ steps.release.outcome }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate version
        id: version
        run: |
          # Get version from gradle using sed (more portable than grep -oP)
          VERSION=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          
          if [ -z "$VERSION" ]; then
            echo "Warning: Could not extract versionName from build.gradle"
            VERSION="1.0.0"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download bootstraps
        uses: actions/download-artifact@v7
        with:
          pattern: bootstrap-*
          path: ./bootstraps
          merge-multiple: true
        continue-on-error: true

      - name: Copy bootstraps to app
        run: |
          mkdir -p app/src/main/cpp
          find ./bootstraps -name "bootstrap-*.zip" -exec cp {} app/src/main/cpp/ \; 2>/dev/null || true
          ls -la app/src/main/cpp/

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/termux-release.keystore
          else
            echo "Warning: KEYSTORE_BASE64 not set, will build unsigned APK"
          fi

      - name: Create signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            cat > signing.properties << EOF
          storeFile=termux-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Copy release APKs
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} release-assets/ \;
          
          # Copy bootstraps
          find ./bootstraps -name "bootstrap-*.zip" -exec cp {} release-assets/ \; 2>/dev/null || true
          
          ls -la release-assets/

      - name: Generate release notes
        run: |
          cat > release-assets/RELEASE_NOTES.md << EOF
          # Termux-Kotlin ${{ steps.version.outputs.version }}
          
          ## Build Information
          
          - **Version:** ${{ steps.version.outputs.version }}
          - **Commit:** ${{ github.sha }}
          - **Build:** #${{ github.run_number }}
          - **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          
          ## Changes Since Last Release
          
          $(git log --oneline --since="1 week ago" | head -20 || echo "No recent commits")
          
          ## Test Results
          
          - Emulator Tests: ${{ needs.emulator_test.result }}
          - Build Status: ${{ needs.build_apk.result }}
          
          ## Download
          
          - **APK (ARM64):** termux-app_*_arm64-v8a.apk
          - **APK (ARM32):** termux-app_*_armeabi-v7a.apk
          - **APK (x86_64):** termux-app_*_x86_64.apk
          - **APK (Universal):** termux-app_*_universal.apk
          
          ## Package Repository
          
          Configure sources.list (the feed is unsigned, so [trusted=yes] is required):
          \`\`\`
          deb [trusted=yes] https://<owner>.github.io/<repo>/repo/<arch>/ ./
          \`\`\`

          Substitute <owner>/<repo> with ${{ github.repository }} (owner in lower case, as GitHub
          Pages serves it) and <arch> with the device's dpkg --print-architecture. The exact line
          for this repository is published at
          https://github.com/${{ github.repository }}/blob/gh-pages/repo/sources.list.template
          
          ---
          
          *Generated by CI/CD Pipeline*
          EOF

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Termux-Kotlin ${{ steps.version.outputs.version }}
          body_path: release-assets/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          files: |
            release-assets/*.apk
            release-assets/bootstrap-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect failure logs
        if: failure()
        run: |
          export JOB_NAME="release"
          export FAILED_STEP="github-release"
          chmod +x scripts/collect-failure-logs.sh
          ./scripts/collect-failure-logs.sh collect

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: failure-release
          path: artifacts/failures/release/
          retention-days: 14

  # ============================================================
  # JOB 10: PR Comment
  # ============================================================
  pr_comment:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [validate_prefix, build_apk, emulator_test]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comment PR with build summary
        uses: actions/github-script@v8
        with:
          script: |
            const prefixStatus = '${{ needs.validate_prefix.result }}';
            const buildStatus = '${{ needs.build_apk.result }}';
            const testStatus = '${{ needs.emulator_test.result }}';
            
            const getEmoji = (status) => {
              if (status === 'success') return '✅';
              if (status === 'failure') return '❌';
              if (status === 'skipped') return '⏭️';
              return '⚠️';
            };
            
            const artifactsUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            
            const body = `## 🤖 CI/CD Pipeline Summary
            
            | Check | Status |
            |-------|--------|
            | ${getEmoji(prefixStatus)} **Prefix Validation** | ${prefixStatus} |
            | ${getEmoji(buildStatus)} **APK Build** | ${buildStatus} |
            | ${getEmoji(testStatus)} **Emulator Tests** | ${testStatus} |
            
            ### 📦 Artifacts
            
            ${buildStatus === 'success' ? `[**Download APKs and Bootstraps**](${artifactsUrl})` : '⚠️ Build did not complete successfully.'}
            
            ---
            <sub>🔨 Commit \`${context.sha.substring(0, 7)}\` | [Workflow Run](${artifactsUrl})</sub>`;
            
            // Find and update existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('CI/CD Pipeline Summary')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ============================================================
  # JOB 11: Cleanup Old Artifacts
  # ============================================================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build_apk]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 30
          keep_minimum_runs: 10
        continue-on-error: true
